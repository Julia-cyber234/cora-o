<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart in Motion</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030008;
  touch-action: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#hint {
  position: fixed;
  bottom: 28px;
  left: 0;
  width: 100%;
  text-align: center;
  color: rgba(255,180,235,0.55);
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  pointer-events: none;
  text-shadow: 0 0 12px #ff008c;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div id="hint">TOQUE PARA DESPERTAR</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });

let width, height, cx, cy, scale;
let particles = [];
let dust = [];

const COUNT = 30000;

const pointer = {
  x: -9999,
  y: -9999,
  active: false,
  down: false
};

let explosion = 0;
let pulseBoost = 0;
let lastTime = 0;

// ==================================================
// RESOLUÇÃO
// ==================================================

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;

  const dpr = Math.min(window.devicePixelRatio || 1, 1.35);

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cx = width / 2;
  cy = height / 2;

  scale = Math.min(width / 38, height / 34);
}

resize();

window.addEventListener("resize", resize);

// ==================================================
// CORAÇÃO
// ==================================================

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),

    y: -(13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t))
  };
}

// ==================================================
// BRILHO PRÉ-CALCULADO
// ==================================================

function createSprite(color1, color2, color3) {
  const s = document.createElement("canvas");

  s.width = 48;
  s.height = 48;

  const c = s.getContext("2d");

  const g = c.createRadialGradient(
    24, 24, 0,
    24, 24, 24
  );

  g.addColorStop(0, color1);
  g.addColorStop(0.16, color2);
  g.addColorStop(0.5, color3);
  g.addColorStop(1, "rgba(0,0,0,0)");

  c.fillStyle = g;
  c.fillRect(0, 0, 48, 48);

  return s;
}

const sprites = [
  createSprite(
    "rgba(255,255,255,1)",
    "rgba(255,220,255,0.9)",
    "rgba(255,80,220,0.35)"
  ),

  createSprite(
    "rgba(255,180,245,1)",
    "rgba(255,60,210,0.85)",
    "rgba(255,0,160,0.3)"
  ),

  createSprite(
    "rgba(255,100,220,0.95)",
    "rgba(230,0,170,0.8)",
    "rgba(190,0,120,0.25)"
  ),

  createSprite(
    "rgba(255,240,255,0.95)",
    "rgba(255,130,220,0.7)",
    "rgba(255,30,180,0.2)"
  )
];

// ==================================================
// CRIAÇÃO DAS PARTÍCULAS
// ==================================================

function createParticles() {
  particles = [];

  for (let i = 0; i < COUNT; i++) {

    const t = Math.random() * Math.PI * 2;
    const point = heart(t);

    // Distribuição mais densa perto do contorno
    const r = Math.pow(Math.random(), 0.48);

    const bx = point.x * r;
    const by = point.y * r;

    particles.push({

      bx,
      by,

      // Deslocamento físico
      ox: 0,
      oy: 0,

      vx: 0,
      vy: 0,

      size: Math.random() * 1.2 + 0.35,

      phase: Math.random() * Math.PI * 2,

      speed: Math.random() * 1.2 + 0.3,

      drift: Math.random() * 0.12 + 0.02,

      sprite: Math.floor(Math.random() * 4),

      alpha: Math.random() * 0.45 + 0.55
    });
  }
}

// ==================================================
// POEIRA
// ==================================================

function createDust() {
  dust = [];

  for (let i = 0; i < 220; i++) {
    dust.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 1.2 + 0.2,
      phase: Math.random() * 6.28,
      speed: Math.random() * 0.8 + 0.2
    });
  }
}

createParticles();
createDust();

// ==================================================
// FUNDO E AURA
// ==================================================

function drawBackground() {

  ctx.fillStyle = "#030008";
  ctx.fillRect(0, 0, width, height);

  const aura = ctx.createRadialGradient(
    cx, cy, 0,
    cx, cy, Math.min(width, height) * 0.48
  );

  aura.addColorStop(0, "rgba(150,0,95,0.17)");
  aura.addColorStop(0.3, "rgba(80,0,55,0.10)");
  aura.addColorStop(1, "rgba(3,0,8,0)");

  ctx.fillStyle = aura;
  ctx.fillRect(0, 0, width, height);
}

// ==================================================
// EXPLOSÃO
// ==================================================

function explode() {

  explosion = 1;
  pulseBoost = 1;

  for (const p of particles) {

    const angle = Math.random() * Math.PI * 2;

    // Distribui a força da explosão
    const force = Math.random() * 8 + 2;

    p.vx += Math.cos(angle) * force;
    p.vy += Math.sin(angle) * force;

    // Algumas partículas recebem impulsos maiores
    if (Math.random() < 0.08) {
      p.vx *= 2;
      p.vy *= 2;
    }
  }
}

// ==================================================
// INTERAÇÃO COM CURSOR
// ==================================================

function disturbParticles(p, x, y) {

  if (!pointer.active) return;

  const dx = x - pointer.x;
  const dy = y - pointer.y;

  const distanceSq = dx * dx + dy * dy;

  const radius = pointer.down ? 150 : 95;

  if (distanceSq > radius * radius || distanceSq < 1) {
    return;
  }

  const distance = Math.sqrt(distanceSq);

  const force = (1 - distance / radius) *
    (pointer.down ? 2.8 : 1.1);

  // Repulsão
  p.vx += (dx / distance) * force;
  p.vy += (dy / distance) * force;
}

// ==================================================
// EVENTOS
// ==================================================

function setPointer(x, y) {
  pointer.x = x;
  pointer.y = y;
  pointer.active = true;
}

canvas.addEventListener("pointerdown", (e) => {
  setPointer(e.clientX, e.clientY);
  pointer.down = true;
  explode();
});

canvas.addEventListener("pointermove", (e) => {
  setPointer(e.clientX, e.clientY);
});

canvas.addEventListener("pointerup", () => {
  pointer.down = false;
});

canvas.addEventListener("pointercancel", () => {
  pointer.down = false;
});

canvas.addEventListener("pointerleave", () => {
  pointer.active = false;
  pointer.down = false;
});

// ==================================================
// ANIMAÇÃO
// ==================================================

function animate(timestamp) {

  requestAnimationFrame(animate);

  const dt = lastTime
    ? Math.min((timestamp - lastTime) / 16.67, 2)
    : 1;

  lastTime = timestamp;

  const time = timestamp * 0.001;

  drawBackground();

  // Poeira
  for (const d of dust) {

    const alpha =
      0.12 + Math.sin(time * d.speed + d.phase) * 0.12;

    ctx.fillStyle =
      `rgba(255,120,220,${Math.max(0, alpha)})`;

    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Pulso
  const normalPulse =
    1 + Math.sin(time * 2.2) * 0.035;

  pulseBoost *= Math.pow(0.94, dt);

  const pulse =
    normalPulse + pulseBoost * 0.09;

  // Movimento natural
  const driftX = Math.sin(time * 0.4) * 0.4;
  const driftY = Math.cos(time * 0.5) * 0.4;

  ctx.globalCompositeOperation = "lighter";

  for (const p of particles) {

    // Posição base com movimento orgânico
    const waveX =
      Math.sin(time * p.speed + p.phase) * p.drift;

    const waveY =
      Math.cos(time * p.speed + p.phase) * p.drift;

    const baseX =
      cx + (p.bx + waveX + driftX) * scale * pulse;

    const baseY =
      cy + (p.by + waveY + driftY) * scale * pulse;

    // Repulsão do cursor
    disturbParticles(p, baseX + p.ox, baseY + p.oy);

    // Retorno ao formato original
    p.vx += -p.ox * 0.018 * dt;
    p.vy += -p.oy * 0.018 * dt;

    // Amortecimento
    p.vx *= Math.pow(0.94, dt);
    p.vy *= Math.pow(0.94, dt);

    // Movimento
    p.ox += p.vx * dt;
    p.oy += p.vy * dt;

    // Posição final
    const x = baseX + p.ox;
    const y = baseY + p.oy;

    // Tamanho
    const size = p.size * 2.1;

    // Brilho
    ctx.globalAlpha =
      p.alpha * (0.8 + Math.sin(time * 2 + p.phase) * 0.2);

    const sprite = sprites[p.sprite];

    ctx.drawImage(
      sprite,
      x - size,
      y - size,
      size * 2,
      size * 2
    );
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

requestAnimationFrame(animate);

</script>
</body>
</html>
